<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- App icon: a bottle of sorted layers. Everything sits inside the central
       circle Android keeps when it crops icons (radius 40% of the size). -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="100%">
      <stop offset="0" stop-color="#2b3550"/>
      <stop offset="1" stop-color="#141826"/>
    </radialGradient>
    <clipPath id="inside">
      <path d="M193 118 V330 A63 63 0 0 0 319 330 V118 Z"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g clip-path="url(#inside)">
    <rect x="186" y="331" width="140" height="70" fill="#e74c3c"/>
    <rect x="186" y="266" width="140" height="66" fill="#3498db"/>
    <rect x="186" y="201" width="140" height="66" fill="#2ecc71"/>
    <rect x="186" y="136" width="140" height="66" fill="#f1c40f"/>
    <g stroke="#000" stroke-opacity="0.15" stroke-width="3">
      <line x1="186" y1="331" x2="326" y2="331"/>
      <line x1="186" y1="266" x2="326" y2="266"/>
      <line x1="186" y1="201" x2="326" y2="201"/>
    </g>
  </g>
  <!-- Glass outline and rim -->
  <path d="M190 112 V330 A66 66 0 0 0 322 330 V112" fill="none" stroke="#e6e9f5" stroke-width="12" stroke-linejoin="round"/>
  <line x1="176" y1="112" x2="336" y2="112" stroke="#e6e9f5" stroke-width="12" stroke-linecap="round"/>
  <!-- Highlight -->
  <rect x="210" y="150" width="12" height="160" rx="6" fill="#fff" fill-opacity="0.22"/>
</svg>
