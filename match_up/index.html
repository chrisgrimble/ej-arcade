<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Match Up</title>
<meta name="theme-color" content="#8e6bff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: #8e6bff;
    background-image: radial-gradient(rgba(255,255,255,.16) 2px, transparent 2px);
    background-size: 22px 22px;
    font-family: "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
    color: #233;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
  }
  .screen[hidden] { display: none; }

  .bar { display: flex; align-items: center; gap: 8px; }
  .round {
    flex: 0 0 54px; height: 54px; border: 0; border-radius: 16px;
    background: #fff; box-shadow: 0 4px 0 #6a4bd6;
    font-size: 26px; line-height: 1; padding: 0;
  }
  .round:active { transform: translateY(3px); box-shadow: 0 1px 0 #6a4bd6; }

  /* ---------- Menu ---------- */
  #menu { overflow-y: auto; }
  h1 {
    flex: 1; margin: 0; text-align: center;
    font-size: clamp(28px, 8vw, 48px); color: #fff;
    text-shadow: 3px 3px 0 #6a4bd6, -2px -2px 0 #6a4bd6, 2px -2px 0 #6a4bd6, -2px 2px 0 #6a4bd6;
    letter-spacing: 1px;
  }
  .label { margin: 16px 0 8px; text-align: center; font-size: 20px; font-weight: bold; color: #fff; text-shadow: 2px 2px 0 #6a4bd6; }
  .sizes { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .size {
    width: 74px; height: 74px; border: 0; border-radius: 18px;
    background: #fff; box-shadow: 0 5px 0 #6a4bd6;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    font-size: 22px; font-weight: bold;
  }
  .size.on { background: #ffd94a; box-shadow: 0 5px 0 #d1a400; transform: translateY(-3px); }
  .size .grid { display: grid; gap: 2px; }
  .size .grid i { width: 7px; height: 7px; border-radius: 2px; background: #8e6bff; }
  .themes {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    max-width: 900px; width: 100%; margin: 0 auto 16px;
  }
  .theme {
    position: relative; border: 0; padding: 10px 6px 8px; border-radius: 18px;
    background: #fff; box-shadow: 0 5px 0 #6a4bd6;
    text-align: center; font-size: 16px; font-weight: bold;
  }
  .theme:active { transform: translateY(3px); box-shadow: 0 2px 0 #6a4bd6; }
  .theme .peek { display: block; font-size: 40px; line-height: 1.3; margin-bottom: 4px; }
  .theme .done {
    position: absolute; top: -6px; right: -6px;
    background: #ffd94a; border-radius: 14px; padding: 3px 8px;
    font-size: 13px; box-shadow: 0 2px 0 #d1a400;
  }

  /* ---------- Play ---------- */
  #count {
    flex: 1; text-align: center; font-size: 22px; font-weight: bold; color: #fff;
    text-shadow: 2px 2px 0 #6a4bd6;
  }
  #area { position: relative; flex: 1; margin-top: 8px; display: flex; align-items: center; justify-content: center; }
  #cards { display: grid; gap: var(--gap); }
  .card {
    width: var(--card); height: var(--card);
    border: 0; padding: 0; background: none;
    perspective: 600px; touch-action: manipulation;
  }
  .card .inner {
    display: block; position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d; transition: transform .35s;
  }
  .card.up .inner { transform: rotateY(180deg); }
  .card .back, .card .face {
    position: absolute; inset: 0; border-radius: 16%;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .card .back {
    background: #ffd94a;
    background-image: radial-gradient(#ffb800 18%, transparent 19%);
    background-size: 25% 25%;
    box-shadow: 0 5px 0 #d1a400, inset 0 0 0 4px #fff;
    color: #fff; font-size: calc(var(--card) * .45); font-weight: bold;
    text-shadow: 2px 2px 0 #d1a400;
  }
  .card .face {
    transform: rotateY(180deg);
    background: #fff; box-shadow: 0 5px 0 #6a4bd6;
    font-size: calc(var(--card) * .6); line-height: 1;
  }
  .card.matched .face { background: #e4ffe4; box-shadow: 0 5px 0 #3fbf55, inset 0 0 0 4px #5be36b; }
  .card.matched .inner { animation: hop .45s; }
  .card.miss .inner { animation: shake .35s; }
  @keyframes hop { 0%, 100% { transform: rotateY(180deg) scale(1); } 50% { transform: rotateY(180deg) scale(1.15); } }
  @keyframes shake {
    0%, 100% { transform: rotateY(180deg) translateX(0); }
    25% { transform: rotateY(180deg) translateX(-6%); }
    75% { transform: rotateY(180deg) translateX(6%); }
  }

  /* ---------- Well done ---------- */
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
  #win {
    position: fixed; inset: 0; z-index: 40;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.25);
  }
  #win[hidden] { display: none; }
  .panel {
    background: #fff; border-radius: 26px; padding: 22px 26px; text-align: center;
    box-shadow: 0 8px 0 #6a4bd6; animation: bounce .5s;
  }
  .panel .big { font-size: 40px; font-weight: bold; color: #ff5fa2; margin-bottom: 6px; }
  .panel .stars { font-size: 34px; margin-bottom: 6px; }
  .panel .goes { font-size: 18px; margin-bottom: 14px; }
  .panel .bar { justify-content: center; }
  .panel .round { flex-basis: auto; padding: 0 16px; font-size: 20px; font-weight: bold; }
  @keyframes bounce { 0% { transform: scale(.3); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }

  @media (prefers-reduced-motion: reduce) {
    .card .inner { transition: none; }
    .card.matched .inner, .card.miss .inner, .panel { animation: none; }
  }
</style>
</head>
<body>

<section class="screen" id="menu">
  <div class="bar">
    <button class="round" id="home" aria-label="Back to the arcade">🏠</button>
    <h1>Match Up</h1>
    <span style="flex: 0 0 54px"></span>
  </div>
  <div class="label">How many cards?</div>
  <div class="sizes" id="sizes"></div>
  <div class="label">Pick some pictures</div>
  <div class="themes" id="themes"></div>
</section>

<section class="screen" id="play" hidden>
  <div class="bar">
    <button class="round" id="back" aria-label="Choose another game">⬅️</button>
    <div id="count"></div>
    <button class="round" id="restart" aria-label="Shuffle and start again">🔀</button>
  </div>
  <div id="area"><div id="cards"></div></div>
</section>

<div id="win" hidden>
  <div class="panel">
    <div class="big">Well done!</div>
    <div class="stars" id="stars"></div>
    <div class="goes" id="goes"></div>
    <div class="bar">
      <button class="round" id="again">🔁 Again</button>
      <button class="round" id="next">🃏 New</button>
    </div>
  </div>
</div>
<canvas id="confetti"></canvas>

<script src="match.js"></script>
</body>
</html>
